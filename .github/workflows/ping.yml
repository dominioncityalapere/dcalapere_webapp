name: Keep DC Alapere Active

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Ping DC Alapere website
        run: |
          curl -f https://dcalapere-webapp-kfjb.vercel.app/ || exit 1

      - name: Check Supabase key
        run: |
          if [ -z "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "SUPABASE_PUBLISHABLE_KEY is missing or empty"
            exit 1
          fi

          echo "Supabase publishable key is available"

      - name: Ping devotionals table
        run: |
          curl -f "https://qjhvgmnrvatdbtyymjjg.supabase.co/rest/v1/devotionals?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            || exit 1
